name: Deploy public briefing to GitHub Pages

# Publishes only site/ — the isolated public-facing briefing page. The
# internal docs/ tree (decision records, policies, source-registration
# reasoning) is never touched or exposed by this workflow.
#
# One-time manual setup required before this works: repo Settings > Pages >
# Source: "GitHub Actions". See site/README.md.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
