name: Tests

# Runs every suite on every pull request and on pushes to main (issue #201).
# Until this existed, a pull request showed no checks and "green" meant a
# session had run the suites by hand. The suites build throwaway databases on
# a PostgreSQL 16 service container; nothing here reaches the archive server,
# a publisher, or any secret.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      # A throwaway service container's password, not a secret.
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # check_numbering.py compares the branch with origin/main.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the project's dependencies
        # The runtime set (setup/install.sh), plus warcio for the WARC
        # cross-check and mcp for archive_mcp/ (founder-approved for that
        # component only, 2026-10-25).
        run: |
          python -m pip install --quiet "psycopg[binary]" PyYAML warcio -r archive_mcp/requirements.txt
          psql --version
      - name: Run every suite
        run: .github/scripts/run_suites.sh
