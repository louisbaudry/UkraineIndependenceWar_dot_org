# Candidate sources — sanctions authorities and their instruments
#
# Status: CANDIDATE. Nothing here is registered until the founder accepts it
# (per source, not as a block) and `register.py --commit` is run.
#
# Drafted 2026-08-26 by an AI assistant at the founder's direction, against
# the DR-0067 source-registry schema. Refactored 2026-09-16 to use registration
# classes (DR-0103, adopted Option A). Every class
# carries reasoning in sources/README.md so a decision can be made on the
# reasoning rather than on the value alone.
#
# Scope: the founder chose sanctions and export control as the first thematic
# area. These are institutional publishers with stable formats and near-zero
# special-category personal data, so DR-0071's interim constraints barely bite
# and POL-0001's structuring limits are straightforward to honour.
#
# VERIFICATION STATUS (updated 2026-09-13). Five entries now carry
# `locator_verified`, `run_locators` and a `verification_note`: their files
# were fetched, digested twice, and run through the real collector into a
# throwaway database and storage root.
#   - `eu-consolidated-list`, `ofac-sdn` — 2026-09-08, fully verified
#     (docs/sources/verification-eu-consolidated-list-ofac-sdn.md).
#   - `uk-ofsi-consolidated` — 2026-09-12, fully verified.
#   - `bis-entity-list` — 2026-09-12, PARTIALLY verified: only the Denied
#     Persons List has a verified locator; the Entity List half of this
#     candidate's name does not yet (see its verification_note).
#   (docs/sources/verification-bis-dpl-ofsi-consolidated.md for both.)
#   - `seco-sanctions` — 2026-09-13, fully verified, on a second attempt:
#     the file lives on a different host (sesam.search.admin.ch) than the
#     main site, found by following real site navigation rather than
#     guessing a URL pattern (docs/sources/verification-seco-sanctions.md).
# The remaining two (`eur-lex-sanctions`, `ua-nsdc-sanctions`) remain
# UNFETCHED beyond a reachability probe of their landing pages: every URL
# there is drawn from documentation and prior knowledge, not from a
# successful request for the files themselves. Treat each as a claim to be
# checked on first run — `register.py --dry-run`
# reports exactly what would be attempted, and a 404 on first collection is
# an expected outcome, not a system failure (PRES-007: failed acquisitions
# are first-class).

# =====================================================================
# REGISTRATION CLASSES — organized by jurisdiction first, then topic
# =====================================================================
#
# Each class defines the policy fields that apply to all sources in that
# class. Sources inherit these fields and may override specific ones if
# needed. Class adoption is a founder decision; the founder authorizes
# classes, not individual sources. (DR-0103.)

classes:

  # ===== EUROPEAN UNION =====

  EU-institutional-sanctions:
    # EU Consolidated List and EUR-Lex restrictive measures
    collection_method: http
    collection_cadence: daily
    capture_format: warc
    default_retention_tier: permanent
    default_access_tier: public
    expects_graphic_content: false
    rights_permission: may-redistribute
    rights_basis: >
      Reuse of Commission documents under Decision 2011/833/EU, subject to
      source acknowledgement. NOT LEGALLY REVIEWED — pending POL-0001 §10 review.
    grade_source_reliability: A
    grade_item_credibility: "1"

  # ===== UNITED STATES =====

  US-institutional-sanctions:
    # OFAC SDN and Consolidated lists
    collection_method: http
    collection_cadence: daily
    capture_format: warc
    default_retention_tier: permanent
    default_access_tier: public
    expects_graphic_content: false
    rights_permission: may-redistribute
    rights_basis: >
      US federal government work, not subject to domestic copyright.
      NOT LEGALLY REVIEWED — pending POL-0001 §10 review.
    grade_source_reliability: A
    grade_item_credibility: "1"

  US-institutional-export-control:
    # BIS Entity List and Denied Persons List
    collection_method: http
    collection_cadence: weekly
    capture_format: warc
    default_retention_tier: permanent
    default_access_tier: public
    expects_graphic_content: false
    rights_permission: may-provide-subscribers
    rights_basis: >
      US federal government work and BIS restrictions. Public for review only;
      redistribution subject to BIS terms. NOT LEGALLY REVIEWED — pending
      POL-0001 §10 review.
    grade_source_reliability: A
    grade_item_credibility: "1"

  # ===== UNITED KINGDOM =====

  UK-institutional-sanctions:
    # OFSI Consolidated List
    collection_method: http
    collection_cadence: daily
    capture_format: warc
    default_retention_tier: permanent
    default_access_tier: public
    expects_graphic_content: false
    rights_permission: may-redistribute
    rights_basis: >
      Published under UK Crown Copyright. Reuse permitted under the Open
      Government Licence v3.0. NOT LEGALLY REVIEWED — pending POL-0001 §10 review.
    grade_source_reliability: A
    grade_item_credibility: "1"

  # ===== SWITZERLAND =====

  CH-institutional-sanctions:
    # SECO sanctions list
    collection_method: http
    collection_cadence: weekly
    capture_format: warc
    default_retention_tier: permanent
    default_access_tier: public
    expects_graphic_content: false
    rights_permission: may-redistribute
    rights_basis: >
      Published by Swiss State Secretariat for Economic Affairs (SECO).
      NOT LEGALLY REVIEWED — pending POL-0001 §10 review.
    grade_source_reliability: A
    grade_item_credibility: "1"

  # ===== UKRAINE =====

  UA-state-investigations:
    # NSDC (National Security and Defense Council) decisions and decrees
    collection_method: http
    collection_cadence: weekly
    capture_format: warc
    default_retention_tier: permanent
    default_access_tier: public
    expects_graphic_content: false
    rights_permission: may-redistribute
    rights_basis: >
      Published by Ukrainian state authority. Reuse terms to be determined in
      legal review. NOT LEGALLY REVIEWED — pending POL-0001 §10 review.
    grade_source_reliability: B2
    grade_item_credibility: "1"
    # Note: B2 grade per sources/README.md reasoning — a belligerent authority
    # publishing about its adversary. This does not mean "less likely true"; it
    # means "read with care commensurate to the source type".

sources:

  # ---------------------------------------------------------------------
  # EU — the primary instrument publisher for this project
  # ---------------------------------------------------------------------

  - key: eur-lex-sanctions
    class: EU-institutional-sanctions
    source_type: sanctions-authority
    name: EUR-Lex — restrictive measures (Ukraine/Russia)
    # The two foundational instruments identified 2026-09-20: Council
    # Regulation (EU) No 269/2014 (CELEX 32014R0269, whose Annex I carries
    # the designated-persons list) and Council Decision 2014/145/CFSP
    # (CELEX 32014D0145). run_locators below point at each instrument's
    # *current consolidated version* as fetched that day (dated CELEX
    # suffix 20260807) — this dated suffix advances roughly monthly as the
    # Council amends the regime, so it WILL go stale and needs
    # re-verification at registration time, not treated as a fixed URL.
    # Founder confirmed 2026-09-21: both instruments belong in run_locators
    # (matches scope_rules' "Regulations, Council Decisions and implementing
    # acts"), not the Regulation alone. See verification_note and
    # docs/sources/verification-eur-lex-sanctions.md for what remains open:
    # the right re-verification cadence for the dated CELEX suffix.
    locator: https://eur-lex.europa.eu/
    locator_verified: 2026-09-20
    run_locators:
      - https://eur-lex.europa.eu/legal-content/EN/AUTO/?uri=CELEX:02014R0269-20260807
      - https://eur-lex.europa.eu/legal-content/EN/AUTO/?uri=CELEX:02014D0145-20260807
    verification_note: >
      Identified by following EUR-Lex's own "Consolidated texts" links from
      each instrument's base CELEX page, not by guessing a URL. Both
      instruments' current consolidated versions fetched 2026-09-20: the
      regulation 8 677 685 bytes across three fetches, byte-identical
      except for a per-request _csrf form token (confirmed by diff, not a
      content change). Acquired end to end by the real collector in a
      throwaway database: 2 discovered, 2 acquired, 0 failed, 16 196 543
      bytes preserved, 0 documentary assertions. Unlike every other
      sanctions candidate, this source's designated-persons content lives
      inside amendable primary legislation with a dated consolidated CELEX
      that changes on each amendment (observed roughly monthly over
      2025-2026) rather than a stable list-file locator — the dated suffix
      above WILL go stale and must be re-verified, not assumed permanent.
      Record in docs/sources/verification-eur-lex-sanctions.md.
    publisher: Publications Office of the European Union
    jurisdiction: EU
    primary_languages: [en, fr, de, uk]
    coverage_start: 2014-03-01        # first Crimea-related measures
    scope_rules: >
      Regulations, Council Decisions and implementing acts under the
      Ukraine/Russia restrictive-measures regimes, plus their consolidated
      versions. Legal instruments only.
    exclusions: >
      Case law, preparatory acts, and unrelated regimes. Consolidated texts
      are collected as derivatives alongside the originals, never in place of
      them (DR-0038: instruments have lifecycles).
    # All other policy fields inherited from EU-institutional-sanctions class

  - key: eu-consolidated-list
    class: EU-institutional-sanctions
    source_type: sanctions-authority
    name: EU Consolidated Financial Sanctions List
    # The FSF application root (https://webgate.ec.europa.eu/fsd/fsf) answers
    # 401 without an EU Login session, so it is not usable as the source's
    # address. The public full-list files are served without login from the
    # URLs below; the `token` query value is the fixed public one the
    # Commission publishes in its own download links, not a credential of
    # this project. Verified 2026-09-08 — see verification_note.
    locator: https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content?token=dG9rZW4tMjAxNw
    locator_verified: 2026-09-08
    run_locators:
      - https://webgate.ec.europa.eu/fsd/fsf/public/files/xmlFullSanctionsList_1_1/content?token=dG9rZW4tMjAxNw
      - https://webgate.ec.europa.eu/fsd/fsf/public/files/csvFullSanctionsList_1_1/content?token=dG9rZW4tMjAxNw
    verification_note: >
      Both files fetched 2026-09-08, XML 25 766 640 bytes and CSV 25 166 172
      bytes, digests stable across two fetches, and acquired end to end by
      the real collector in a throwaway database. Server-side Last-Modified
      was 2026-08-05 for both. Record in
      docs/sources/verification-eu-consolidated-list-ofac-sdn.md.
    publisher: European Commission (DG FISMA)
    jurisdiction: EU
    primary_languages: [en]
    coverage_start: 2014-03-17
    scope_rules: >
      The consolidated list in its structured form, captured as a whole file
      each time it changes. Each capture is a distinct holding forming a
      capture series (DR-0074), so the designation lifecycle is reconstructible
      from successive states rather than asserted.
    exclusions: >
      No enrichment against other registries at collection time. Designation
      records stay distinct from canonical entities; mapping is a reviewed act
      at T1 (DR-0039, DR-0063, LEGAL-003).
    # Override: verified as a bare-body HTTP fetch, not a WARC capture
    # (DR-0006/DR-0067's capture-format guardrail). Without this override the
    # class default of `warc` would silently misrecord how this source was
    # actually verified and registered under DR-0093 — the same fix ofac-sdn
    # already carries below for the same reason.
    capture_format: http
    # All other policy fields inherited from EU-institutional-sanctions class
    # Personal-data note: designation records name individuals, including
    # dates and places of birth. POL-0001 §4 governs; DR-0071(b) forbids
    # automatic promotion into structured searchable fields, which is why
    # `scope_rules` captures whole files rather than parsing on ingest.

  # ---------------------------------------------------------------------
  # United States
  # ---------------------------------------------------------------------

  - key: ofac-sdn
    class: US-institutional-sanctions
    source_type: sanctions-authority
    name: OFAC Specially Designated Nationals list
    # The Sanctions List Site is the current home (302 to /Home/index.html).
    # Files come from the Sanctions List Service export API, which answers
    # each request with a 302 to a presigned S3 URL (us-gov-west-1) valid for
    # one hour; the legacy treasury.gov/ofac/downloads/sdn.xml address still
    # resolves, via two redirects, to the same object. Register the service
    # URLs, not the legacy one. The CSV exports (SDN.CSV, CONS_PRIM.CSV and
    # companions) also work but are lossy relative to the XML and are not in
    # the first run. Verified 2026-09-08 — see verification_note.
    locator: https://sanctionslist.ofac.treas.gov/
    locator_verified: 2026-09-08
    run_locators:
      - https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN.XML
      - https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/SDN_ADVANCED.XML
      - https://sanctionslistservice.ofac.treas.gov/api/PublicationPreview/exports/CONS_ADVANCED.XML
    verification_note: >
      All three XML exports fetched 2026-09-08 (28 978 335, 126 590 461 and
      4 534 269 bytes; publication 969 of 2026-09-03, list date 2026-09-04),
      SDN.XML digest stable across two fetches, and all three acquired end to
      end by the real collector in a throwaway database. Record in
      docs/sources/verification-eu-consolidated-list-ofac-sdn.md.
    publisher: US Treasury, Office of Foreign Assets Control
    jurisdiction: US
    primary_languages: [en]
    coverage_start: 2014-03-06
    scope_rules: >
      SDN list and the Consolidated Sanctions List in their structured forms,
      whole-file captures forming a capture series.
    exclusions: >
      Interpretive guidance, FAQs and press releases — different evidentiary
      character, registered separately if wanted.
    # Whole-file capture means the whole file: of 19 329 SDN entries observed
    # on 2026-09-08, about a third sit under RUSSIA-EO14024 and the rest under
    # programmes with no connection to this project (SDGT, SDNTK, CUBA and
    # others), many naming individuals with dates and places of birth. The
    # file is preserved unparsed (DR-0071(b)); structuring any of it is a
    # Gate 2 act under POL-0001 §4. The breadth is a data-minimisation point
    # for the POL-0001 §10 legal review, recorded here so it is not forgotten.
    capture_format: http
    default_retention_tier: permanent
    default_access_tier: public
    expects_graphic_content: false
    rights_permission: may-redistribute
    rights_basis: >
      US federal government work, not subject to domestic copyright.
      NOT LEGALLY REVIEWED.
    grade_source_reliability: A
    grade_item_credibility: "1"

  - key: bis-entity-list
    class: US-institutional-export-control
    source_type: sanctions-authority
    name: BIS Entity List and Denied Persons List
    # bis.doc.gov now redirects to bis.gov (a domain migration since this
    # candidate was drafted). Verified 2026-09-12 — see verification_note.
    # PARTIAL: only the Denied Persons List has a verified locator; the
    # Entity List (Supplement No. 4 to Part 744, published as CFR text, not
    # a standalone file) does not yet. See the verification record.
    locator: https://www.bis.gov/
    locator_verified: 2026-09-12
    run_locators:
      - https://media.bis.gov/sites/default/files/dpl_04142026.csv
    verification_note: >
      Denied Persons List CSV fetched twice 2026-09-12, 110 427 bytes,
      digest stable, and acquired end to end by the real collector in a
      throwaway database. The Entity List half of this candidate's name has
      no verified locator yet — BIS's own site links to the regulation text
      (EAR §744.16), not a data file, and the Commerce Department's
      Consolidated Screening List (a real, working file) was deliberately
      not substituted because it merges in OFAC's own lists and would
      misattribute them to BIS. Record in
      docs/sources/verification-bis-dpl-ofsi-consolidated.md.
    publisher: US Department of Commerce, Bureau of Industry and Security
    jurisdiction: US
    primary_languages: [en]
    coverage_start: 2014-08-01
    scope_rules: >
      Entity List, Denied Persons List, Unverified List, and Federal Register
      notices amending them. Export-control state is decomposed (DR-0042), so
      listing on any of these is recorded as its own restriction rather than
      collapsed into one "restricted" flag.
    exclusions: Licensing statistics and general policy commentary.
    # Overrides: verified as a bare-body HTTP fetch, not a WARC capture
    # (capture_format). rights_permission is may-redistribute, the value the
    # Denied Persons List half of this candidate was actually verified and
    # described against — the class default of may-provide-subscribers
    # (written for sources with a BIS subscriber-only redistribution term)
    # does not apply here and would misstate this source's rights posture.
    capture_format: http
    rights_permission: may-redistribute
    rights_basis: US federal government work. NOT LEGALLY REVIEWED.
    # All other policy fields inherited from US-institutional-export-control class

  # ---------------------------------------------------------------------
  # United Kingdom and Switzerland
  # ---------------------------------------------------------------------

  - key: uk-ofsi-consolidated
    class: UK-institutional-sanctions
    source_type: sanctions-authority
    name: UK OFSI Consolidated List of Financial Sanctions Targets
    # The gov.uk page is a publication page, not a file; the actual files
    # are hosted on OFSI's own blob storage, linked from a sub-page.
    # Verified 2026-09-12 — see verification_note.
    locator: https://www.gov.uk/government/publications/financial-sanctions-consolidated-list-of-targets
    locator_verified: 2026-09-12
    run_locators:
      - https://ofsistorage.blob.core.windows.net/publishlive/2022format/ConList.csv
      - https://ofsistorage.blob.core.windows.net/publishlive/2022format/ConList.xml
    verification_note: >
      Both files fetched twice 2026-09-12 (CSV 16 641 139 bytes, XML
      54 098 673 bytes), digests stable across both fetches, and both
      acquired end to end by the real collector in a throwaway database.
      Server-side Last-Modified was 2026-06-03 for both. The TXT variant
      also linked from the same page was not fetched — redundant with the
      CSV for this project's purposes. Record in
      docs/sources/verification-bis-dpl-ofsi-consolidated.md.
    publisher: HM Treasury, Office of Financial Sanctions Implementation
    jurisdiction: GB
    primary_languages: [en]
    coverage_start: 2014-03-01
    scope_rules: Consolidated list, whole-file captures forming a capture series.
    exclusions: General licences and enforcement notices (registered separately if wanted).
    # Overrides: verified as a bare-body HTTP fetch, not a WARC capture
    # (DR-0006/DR-0067's capture-format guardrail — the class default of
    # `warc` does not match how this source was actually verified and would
    # silently misrecord it if inherited). rights_basis kept verbatim as the
    # text the source was verified and described against.
    capture_format: http
    rights_basis: >
      Open Government Licence v3.0, subject to attribution.
      NOT LEGALLY REVIEWED.
    # All other policy fields inherited from UK-institutional-sanctions class

  - key: seco-sanctions
    class: CH-institutional-sanctions
    source_type: sanctions-authority
    name: SECO sanctions list (Switzerland)
    # The landing page has no direct file link; the real download lives on
    # a separate host reached by following the site's own navigation
    # (Sanctions section -> "Searching for subjects (SECO sanctions
    # list)" -> the Gesamtliste/overall-list download). Verified
    # 2026-09-13 — see verification_note.
    locator: https://www.seco.admin.ch/
    locator_verified: 2026-09-13
    run_locators:
      - https://www.sesam.search.admin.ch/sesam-search-web/pages/downloadXmlGesamtliste.xhtml?lang=en&action=downloadXmlGesamtlisteAction
    verification_note: >
      Found by following the site's real navigation (seco.admin.ch ->
      /en/sanctions-en -> /en/searching-for-subjects-sanctions -> the
      Gesamtliste XML download on sesam.search.admin.ch), not by guessing
      a URL pattern. Fetched twice 2026-09-13, 42 300 406 bytes, digest
      stable. Content is identical across the de/en/fr/it lang= variants
      (same digest); en is registered as the canonical run locator.
      17 312 <target> elements, dated 2026-09-04 in the file itself.
      Acquired end to end by the real collector in a throwaway database:
      1 discovered, 1 acquired, 0 failed, 0 documentary assertions.
      Record in docs/sources/verification-seco-sanctions.md.
    publisher: State Secretariat for Economic Affairs
    jurisdiction: CH
    primary_languages: [de, fr, it, en]
    coverage_start: 2014-03-01
    scope_rules: >
      Swiss sanctions ordinances and the consolidated list. Included because
      Switzerland's non-EU status makes divergence between its measures and
      the EU's evidentially interesting (§68–70: financial flows).
    exclusions: Commentary and press material.
    # Overrides: verified as a bare-body HTTP fetch, not a WARC capture
    # (capture_format). rights_permission is the conservative may-preserve
    # DR-0098 approved for this source specifically, because its rights
    # position is unverified — the class default of may-redistribute (set
    # for sources whose reuse basis IS known, like the EU/UK/US institutional
    # publishers) would misstate an approval DR-0098 never gave.
    capture_format: http
    rights_permission: may-preserve
    rights_basis: >
      Rights position UNVERIFIED. Conservative default until checked: preserve
      only, no redistribution (§14, DR-0067).
    # All other policy fields inherited from CH-institutional-sanctions class

  # ---------------------------------------------------------------------
  # Ukraine
  # ---------------------------------------------------------------------

  - key: ua-nsdc-sanctions
    class: UA-state-investigations
    source_type: official-ukrainian
    name: NSDC sanctions decisions and presidential decrees enacting them
    # 2026-09-20: the specific register this candidate should point to is
    # identified -- https://drs.nsdc.gov.ua, the NSDC's own "State Register
    # of Sanctions," linked from every rnbo.gov.ua page's own navigation --
    # but NOT verified: it returns HTTP 403 behind a Cloudflare managed
    # challenge from this session, the same class of block found on
    # Légifrance (docs/sources/verification-lil-articles.md). No
    # run_locators added; locator stays the publisher's main site until the
    # register is actually reachable. See
    # docs/sources/verification-ua-nsdc-sanctions.md.
    locator: https://www.rnbo.gov.ua/
    publisher: National Security and Defence Council of Ukraine
    jurisdiction: UA
    primary_languages: [uk]
    coverage_start: 2014-09-01
    scope_rules: >
      NSDC decisions imposing sanctions and the presidential decrees enacting
      them. Ukraine designates entities the EU and US do not, and the
      divergence is itself evidence.
    exclusions: >
      Operational military statements and casualty reporting — different
      evidentiary character and a different personal-data profile; register
      separately, not here.
    # Overrides: rights_permission is the conservative may-preserve default
    # for a candidate whose rights position is unverified, unlike the class
    # default of may-redistribute. grade_source_reliability B and
    # grade_item_credibility "2" (rather than the class's B2/"1") are this
    # candidate's own triage judgment (DR-0027: triage only, never truth) —
    # a belligerent authority publishing about its adversary, read with
    # commensurate care; not yet reconciled with the class's B2 label.
    rights_permission: may-preserve
    rights_basis: >
      Rights position UNVERIFIED. Ukrainian state works may be reusable; not
      assumed. Conservative default until checked.
    grade_source_reliability: B
    grade_item_credibility: "2"
    # All other policy fields inherited from UA-state-investigations class
    # Reliability B rather than A: this is a party to the conflict publishing
    # about its adversary. The grade is triage only and never touches truth
    # (DR-0027) — it means "read with the care a belligerent source deserves",
    # not "less likely to be true".
    # LANGUAGE: Ukrainian only. Registering this commits the project to
    # Ukrainian reading capacity at Gate 2. DR-0081 seeds no translations.

# ---------------------------------------------------------------------
# Declared dependence between these sources (DR-0028, DR-0067)
# ---------------------------------------------------------------------
#
# Stating known republishing once, rather than rediscovering it per item.
# Five lists naming the same person are not five independent confirmations —
# they are, in part, one designation propagating (§36).

dependence:
  - from: eu-consolidated-list
    to: eur-lex-sanctions
    relation: derives-from
    note: >
      The consolidated list is an administrative compilation of the
      instruments published in EUR-Lex. It is not independent evidence of a
      designation; the instrument is.

  - from: uk-ofsi-consolidated
    to: eu-consolidated-list
    relation: common-evidentiary-origin
    note: >
      For pre-Brexit designations the UK list inherits EU designations
      wholesale. Post-2021 divergence is real and evidentially interesting;
      the shared origin before that is not.

  - from: seco-sanctions
    to: eu-consolidated-list
    relation: common-evidentiary-origin
    note: >
      Switzerland frequently mirrors EU measures. Where it does, the two are
      one line, not two. Where it does not, the divergence is the finding.
