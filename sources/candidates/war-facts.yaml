# Candidate sources — territorial control and military operations
#
# Status: CANDIDATE. Nothing here is registered until the founder accepts it
# (per source, not as a block) and `register.py --commit` is run.
#
# Drafted 2026-09-21 by an AI assistant at the founder's direction, against
# the DR-0067 source-registry schema, following the founder's redirection
# toward war-fact subject matter (territorial control / military operations
# category, chosen first over civilian-harm or war-crimes categories for its
# lower personal-data sensitivity — see README.md's Recent work table).
#
# Scope: "where is the front line, and why did it move" — the foundational
# war-fact category everything else (an incident, a casualty report, a
# war-crimes allegation) needs a place and a date to sit against. Two
# sources, deliberately complementary rather than redundant: one gives the
# geometry, the other gives the narrative explaining it.
#
# VERIFICATION STATUS (2026-09-21). Both candidates below were fetched live
# and rehearsed end to end through the real collector into a throwaway
# database (1 discovered, 1 acquired, 0 failed each). See
# docs/sources/verification-war-facts-first-two.md for the full record.
# Neither is registered. Unlike every sanctions candidate, rights positions
# for both are UNVERIFIED — ISW's site states "ALL RIGHTS RESERVED"
# explicitly (conservative may-preserve is the obvious floor, not really in
# question); DeepStateMap's licensing was not found anywhere on the site in
# this session's search and needs a person to look harder or ask the
# operators directly before any redistribution claim could be made.

classes:

  war-facts-territorial-control:
    # Sources that track or narrate where military control actually sits,
    # as opposed to sanctions/legal-instrument sources. Different risk
    # profile from the sanctions classes: no designated-persons data, but
    # also no institutional-publisher redistribution rights to inherit —
    # both current candidates are volunteer/think-tank publishers, not
    # governments or IGOs, so the class default is conservative.
    collection_method: http
    collection_cadence: daily
    capture_format: warc
    default_retention_tier: permanent
    default_access_tier: public
    rights_permission: may-preserve
    rights_basis: >
      Rights position UNVERIFIED for every source in this class. Neither
      candidate is a government or intergovernmental publisher with an
      obvious institutional reuse basis (contrast the sanctions-authority
      classes); each needs its own rights check, not a class-level default,
      before any redistribution claim (§14, DR-0067).
    expects_graphic_content: false
    grade_source_reliability: B
    grade_item_credibility: "2"

sources:

  - key: isw-orca
    class: war-facts-territorial-control
    source_type: think-tank
    name: ISW Russian Offensive Campaign Assessment
    # The stable index page lists every dated report; the actual document
    # to preserve each day is that day's own dated URL, which is why this
    # candidate's real run_locators (once verified per run) are individual
    # dated report pages, not the index alone — closer to rnbo.gov.ua's
    # decree-stream pattern than to a single stable list-file locator.
    # Verified 2026-09-21 against the 2026-09-20 report specifically.
    locator: https://understandingwar.org/analysis/russia-ukraine/russian-offensive-campaign-assessment/
    locator_verified: 2026-09-21
    run_locators:
      - https://understandingwar.org/research/russia-ukraine/russian-offensive-campaign-assessment-september-20-2026/
    verification_note: >
      Reachable this session (200, following a 301 from the analysis/
      URL to the actual research/ URL — ISW restructured its URL scheme
      at some point, both forms currently resolve). Rehearsed through the
      real collector: 1 discovered, 1 acquired, 0 failed, 445 121 bytes
      preserved, 0 documentary assertions. capture_format warc (not a
      bare HTTP body) because the page embeds maps/graphics that are part
      of the assessment's actual content, not decoration — a bare-body
      fetch would lose them. "ALL RIGHTS RESERVED" found in the page
      footer text directly (not inferred), confirming the class default.
      Publishes daily; this candidate's run_locators will need updating to
      each new day's URL before every run, the same manual-re-verification
      obligation eur-lex-sanctions carries for its own reason (DR-0105).
      Record in docs/sources/verification-war-facts-first-two.md.
      2026-10-06: ISW publishes a Fair Use and Attribution Policy (last
      revised 2026-01-08, linked from every report's footer) that limits use
      to viewing and sharing in published form and quoting with attribution,
      requires prior written permission for "incorporation of ISW Materials
      into other datasets ... or systems", and bars redistribution "in bulk,
      via API, or through automated means". Whether a private preserved copy
      is "incorporation" is a legal question (POL-0001 section 10). HELD by
      the founder's ruling of 2026-10-06 until ISW answers a written
      permission request; see docs/sources/verification-war-facts-first-two.md
      section 5.
    publisher: Institute for the Study of War
    jurisdiction: US
    primary_languages: [en]
    coverage_start: 2022-02-24        # ISW's daily assessment series began with the full-scale invasion
    scope_rules: >
      ISW's daily "Russian Offensive Campaign Assessment" reports:
      territorial control, front-line movement, and the operational
      narrative explaining it. One report per day, dated. Text and
      embedded maps/graphics only.
    exclusions: >
      ISW's other publication series (Iran, other regions) and any
      op-ed/commentary content outside the daily assessment series
      itself — different scope, register separately if ever wanted.

  - key: deepstatemap
    class: war-facts-territorial-control
    source_type: public-dataset
    name: DeepStateMap territorial control (Ukraine)
    # The actual data locator is an unauthenticated JSON API endpoint, not
    # the interactive map page itself — found by checking a known public
    # API pattern (deepstatemap.live/api/history/last), not from any link
    # on the page: the site is a JS-rendered SPA with no visible API link
    # in its raw HTML.
    locator: https://deepstatemap.live/
    locator_verified: 2026-10-06
    run_locators:
      - https://deepstatemap.live/api/history/last
    verification_note: >
      Re-verified 2026-10-06: reachable, 200, 627 364 bytes both times (two
      fetches 20 seconds apart, identical), map id 1791147415, 525 features,
      content-type application/json, and the body's own `datetime` field
      reads "04.10 22:56", so the map is republished when DeepState updates
      it, not on every request; a run made between updates re-captures
      identical bytes. Still no licence or terms text found on the site
      (/terms, /privacy, /about, /license and /api return 404).
      Original verification, 2026-09-21: fetched twice, 40 seconds apart: 627 479 bytes both times, same
      map id (1789884551), 525 features — stable within that window,
      though this is a genuinely live front-line dataset, so byte
      stability across longer gaps (a day, a week) is not expected the
      way a static sanctions-list file's is; that instability is the
      point of the source, not a verification failure. Rehearsed
      through the real collector: 1 discovered, 1 acquired, 0 failed,
      627 479 bytes preserved, 0 documentary assertions. capture_format
      http (bare JSON body, not a browsing session — this is a clean
      API response, not a rendered page) unlike isw-orca. No license or
      terms text found anywhere on the site in this session's search;
      rights_permission stays the class default (may-preserve,
      UNVERIFIED) rather than assuming redistribution is fine because
      the endpoint requires no authentication. capture_format overridden
      below because the class default (warc) is right for isw-orca but
      wrong for this bare-JSON-API source (DR-0006/DR-0067's
      capture-format guardrail — see the eu-consolidated-list precedent
      in sanctions-authorities.yaml for the same class-default mismatch
      pattern). Record in docs/sources/verification-war-facts-first-two.md.
    capture_format: http
    publisher: DeepState (Ukrainian volunteer OSINT project)
    jurisdiction: UA
    primary_languages: [uk, en]
    coverage_start: 2022-02-24        # DeepState began tracking at the full-scale invasion
    scope_rules: >
      Front-line control polygons as GeoJSON, via the public
      `/api/history/last` endpoint. The current snapshot only — the
      site's own history browsing (dated past snapshots) is a separate,
      unverified locator pattern not covered by this candidate yet.
    exclusions: >
      The interactive map's UI/rendering layer itself (not evidentiary
      content); any donation/funding pages on the same site.

  - key: liveuamap
    class: war-facts-territorial-control
    source_type: news-media
    name: Liveuamap (Ukraine regional page)
    # Added 2026-10-05, as a third candidate in the territorial-control /
    # operations category, after the 403 that stopped its first check on
    # 2026-09-21 cleared. Unlike the two above it is neither a geometry
    # series nor an analytical narrative: it is a rolling feed of
    # individually geolocated event reports (strikes, explosions, movements)
    # aggregated from social media by crawlers and edited by the publisher.
    # That makes it closer to the strike-tracking sources' subject than to
    # territorial control; the class is kept only because it supplies the
    # conservative may-preserve/UNVERIFIED rights default, and moving it is
    # a registration-time question (see the verification record, section 5).
    locator: https://ukraine.liveuamap.com/
    locator_verified: 2026-10-05
    run_locators:
      - https://ukraine.liveuamap.com/
    verification_note: >
      Reachable 2026-10-05 (200, served through Cloudflare; the 403 seen
      2026-09-21 did not recur). The page is server-rendered HTML carrying
      a rolling window of roughly 30 recent event items plus a world-wide
      banner (non-Ukraine items appear on it), so one capture is a
      snapshot of the latest items only, not a history: a record needs
      captures often enough that items are not lost, which the project
      has no scheduler for. robots.txt names only a sitemap. The Terms of
      Use (https://liveuamap.com/about#terms) say a user "may use our data
      and maps ... partially, or in the whole in your work, with reference
      to liveuamap.com", and that text and images from third-party social
      networks stay under those networks' own terms; they do not mention
      automated access. The publisher also sells a paid API ($150 a month,
      200 requests a day, GeoJSON), which is the sanctioned structured
      route; no undocumented data endpoint was probed. Rehearsed through
      the real collector: see the verification record. UNVERIFIED as a
      legal matter (POL-0001 section 10): the attribution grant is not
      reviewed, and its relation to the paid API is unclear.
    publisher: Liveuamap LLC
    jurisdiction: US
    primary_languages: [en]
    coverage_start: 2014-01-01        # the publisher's own regional Ukraine map; UNVERIFIED, not checked
    scope_rules: >
      The Ukraine regional page's event items as served in the HTML:
      report text, location, time and the link to the original social-media
      source. The page body only.
    exclusions: >
      The map tiles and interface; the other regions' subdomains; the
      third-party images, videos and posts the items link to (their own
      terms apply and they are not fetched); advertising and subscription
      notices; the paid API (not used).
    grade_source_reliability: C
    grade_item_credibility: "3"
