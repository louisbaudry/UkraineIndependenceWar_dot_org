      - "https://old.gp.gov.ua/ua/file_downloader.html?_m=fslib&_t=fsfile&_c=download&file_id=292316"   # January-August 2026
    verification_note: >
      Verified 2026-09-27 through the archive server (Madrid Cloudflare
      edge), because every gp.gov.ua host returns a hard Cloudflare block
      to this project's sessions (US edge). Listing page 200, 83 082 bytes,
      linking 20 reports: January to January-August 2026 (8) and January to
      January-December 2025 (12). Newest file (file_id 292316): 200,
      application/octet-stream, served as "Forma_1_serpen_2026.xlsx",
      418 672 bytes, Last-Modified 4 Sep 2026, SHA-256
      7c5a33a89a7ec2d5d573e54d1b7c6fb67697aeb73c1b08cbf10d329fb4057936. A
      ten-sheet workbook of aggregate counts; its Table 1.20 covers
      offences against peace, the security of mankind and the international
      legal order, with rows for war crimes (Art. 438) and war crimes
      causing death (Art. 438(2)). Re-fetched 2026-09-28 with the
      collector's own User-Agent and with a browser's: both 200 and
      byte-identical to the first fetch. Not rehearsed through the
      collector. Record in
      docs/sources/verification-ua-prosecutor-general.md.
    publisher: Office of the Prosecutor General of Ukraine
    jurisdiction: UA
    primary_languages: [uk]
    # The earliest report linked from the listing is January 2025. Earlier
    # years exist elsewhere on the office's sites and were not looked for.
    coverage_start: 2025-01-01
    scope_rules: >
      The office's monthly unified report on registered criminal offences
      and the results of their pre-trial investigation (Form 1), which is
      cumulative from January of the reporting year: the listing page and
      that month's workbook, as named in run_locators and re-read from the
      listing before each run. The first run alone also takes every
      earlier 2025 and 2026 report the listing linked on 2026-09-27, each
      month's cumulative snapshot kept as its own file. The whole workbook
      is kept; the war-crimes
      rows (Table 1.20, Chapter XX of the Criminal Code) are the reason for
      collecting it. No other page or file.
    exclusions: >
      The office's news posts and its Telegram channel (per-incident posts,
      named suspects and victims, ordinary criminal cases; a different
      candidate if ever), the evidence-submission portal warcrimes.gov.ua,
      and every other statistical report on the office's statistics page.
      Its report on prosecuting conflict-related sexual violence is
      excluded by DR-0109 Decision 2 until its own decision. The children's
      counts the office supplies to childrenofwar.gov.ua are a different
      publisher's page, bundled with deportation and sexual-violence
      counts and missing children's names and photographs, and are not
      part of this candidate. Reports for years before 2025 are not
      in run_locators and were not looked for; collecting them is a
      separate decision.
